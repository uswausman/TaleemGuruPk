<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 440" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cap Gradients -->
    <linearGradient id="capTopGrad" x1="256" y1="20" x2="256" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a85ff"/>
      <stop offset="35%" stop-color="#0260e8"/>
      <stop offset="100%" stop-color="#00359c"/>
    </linearGradient>
    <linearGradient id="capHighlight" x1="120" y1="40" x2="380" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="capBaseGrad" x1="256" y1="120" x2="256" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#002b80"/>
      <stop offset="100%" stop-color="#001a52"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="390" y1="100" x2="390" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e70eb"/>
      <stop offset="100%" stop-color="#003399"/>
    </linearGradient>

    <!-- Figures Gradients -->
    <linearGradient id="blueFigure" x1="180" y1="160" x2="230" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="50%" stop-color="#005bd4"/>
      <stop offset="100%" stop-color="#0038a8"/>
    </linearGradient>
    <linearGradient id="greenFigure" x1="332" y1="160" x2="282" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55d81b"/>
      <stop offset="50%" stop-color="#32b509"/>
      <stop offset="100%" stop-color="#1e8503"/>
    </linearGradient>

    <!-- Book Gradients -->
    <linearGradient id="bookLeftPage" x1="100" y1="230" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="60%" stop-color="#1ea840"/>
      <stop offset="100%" stop-color="#0b7a2b"/>
    </linearGradient>
    <linearGradient id="bookRightPage" x1="412" y1="230" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52db24"/>
      <stop offset="60%" stop-color="#34be0e"/>
      <stop offset="100%" stop-color="#1c8c04"/>
    </linearGradient>
    <linearGradient id="bookBaseBlue" x1="256" y1="310" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="60%" stop-color="#003399"/>
      <stop offset="100%" stop-color="#001f66"/>
    </linearGradient>
    <linearGradient id="cyanStripe" x1="100" y1="330" x2="412" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002266" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- ==================== OPEN BOOK BASE ==================== -->
    <!-- Bottom Deep Blue Spine & Wings -->
    <path d="M 85 328 C 145 310, 205 325, 256 358 C 307 325, 367 310, 427 328 C 405 348, 335 372, 256 368 C 177 372, 107 348, 85 328 Z" fill="url(#bookBaseBlue)" />
    <path d="M 92 322 C 148 306, 204 320, 256 350 C 308 320, 364 306, 420 322 C 375 342, 318 355, 256 352 C 194 355, 137 342, 92 322 Z" fill="url(#cyanStripe)" />

    <!-- White Inner Pages Layer -->
    <path d="M 98 312 C 150 292, 206 306, 256 338 C 306 306, 362 292, 414 312 C 372 328, 316 338, 256 336 C 196 338, 140 328, 98 312 Z" fill="#ffffff" />
    <path d="M 104 298 C 152 278, 208 290, 256 322 C 304 290, 360 278, 408 298 C 368 314, 314 324, 256 322 C 198 324, 144 314, 104 298 Z" fill="#f8fafc" />

    <!-- Top Green/Teal Outer Pages -->
    <path d="M 86 302 C 112 245, 178 238, 250 310 C 195 282, 136 278, 86 302 Z" fill="url(#bookLeftPage)" />
    <path d="M 426 302 C 400 245, 334 238, 262 310 C 317 282, 376 278, 426 302 Z" fill="url(#bookRightPage)" />
    
    <!-- Book Spine Center Fold -->
    <path d="M 256 310 L 256 365" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- ==================== LEARNER FIGURES ==================== -->
    <!-- Left Blue Learner (Body & Arms) -->
    <path d="M 130 172 C 158 205, 192 238, 254 295 C 238 236, 200 190, 182 178 C 168 195, 148 185, 130 172 Z" fill="url(#blueFigure)" />
    <!-- Left Blue Learner (Head) -->
    <circle cx="206" cy="188" r="28" fill="url(#blueFigure)" />

    <!-- Right Green Learner (Body & Arms) -->
    <path d="M 382 172 C 354 205, 320 238, 258 295 C 274 236, 312 190, 330 178 C 344 195, 364 185, 382 172 Z" fill="url(#greenFigure)" />
    <!-- Right Green Learner (Head) -->
    <circle cx="306" cy="188" r="28" fill="url(#greenFigure)" />

    <!-- ==================== GRADUATION CAP ==================== -->
    <!-- Cap Skull Band (Base) -->
    <path d="M 176 128 L 176 162 C 176 178, 212 192, 256 192 C 300 192, 336 178, 336 162 L 336 128 Z" fill="url(#capBaseGrad)" />
    <path d="M 180 156 C 202 168, 230 174, 256 174 C 282 174, 310 168, 332 156" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Cap Mortarboard Diamond Top -->
    <path d="M 256 32 L 396 102 L 256 156 L 116 102 Z" fill="url(#capTopGrad)" />
    <path d="M 256 32 L 396 102 L 256 156 L 116 102 Z" fill="url(#capHighlight)" />
    <path d="M 256 32 L 396 102 L 256 108 L 116 102 Z" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" fill="none" />

    <!-- Cap Button on Top -->
    <ellipse cx="256" cy="94" rx="8" ry="5" fill="#1e40af" />
    <ellipse cx="256" cy="93" rx="6" ry="3.5" fill="#60a5fa" />

    <!-- Tassel Ribbon & Tassel Skirt -->
    <path d="M 256 94 C 298 94, 375 106, 376 138 L 374 154" stroke="#0050d0" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Tassel Ring/Bead -->
    <circle cx="374" cy="155" r="5" fill="#00359c" />
    <circle cx="374" cy="154" r="3" fill="#60a5fa" />
    <!-- Tassel Bell -->
    <path d="M 368 160 L 380 160 L 384 192 C 384 195, 364 195, 364 192 Z" fill="url(#tasselGrad)" />
  </g>
</svg>
